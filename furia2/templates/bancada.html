<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Furia — bancada</title>
<!-- O ícone da aba é o quadradinho do "i" da marca: o LED do painel. Vai
     escrito aqui dentro, não como arquivo, porque arquivo solto é arquivo que
     falta — e sem ele o navegador pedia um /favicon.ico que não existe e
     anotava um erro no registro a cada abertura. Erro falso no registro custa
     caro: é o tipo de linha que faz procurar defeito onde não tem. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Crect x='5' y='5' width='6' height='6' fill='%233ef2a5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="{{ url_for('bancada.static', filename='css/furia2.css') }}">
</head>
<body class="f2-bancada-vazia">

<!-- ══ A BANCADA ══════════════════════════════════════════════════════════
     Três faixas: a fina de cima, a parede no meio (que é quase tudo) e a
     doca embaixo. Nenhuma janela nasce aberta — o centro é sempre dos cortes.
     ═══════════════════════════════════════════════════════════════════════ -->
<div class="f2-bancada">

    <!-- ── a faixa ───────────────────────────────────────────────────────
         Marca, o que a máquina está fazendo, e o contador de fita. -->
    <header class="f2-faixa">
        <div class="f2-marca" data-marca>
            <!-- A marca é desenhada, não escrita: a única fonte garantida numa
                 máquina Windows offline é uma fonte de sistema, e palavra em
                 fonte de sistema é palavra de qualquer programa.
                 Traço fino de espessura única, geométrico, muito espaçado —
                 e o ponto do "i" é um quadradinho: é o LED do painel, o único
                 pedaço da marca que ganha cor quando a máquina trabalha. -->
            <svg viewBox="0 0 68 26" fill="none" role="img" aria-label="Furia"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M4 23 V6.5 C4 3.8 5.6 2.5 8.2 2.5 H10"/>
                <path d="M0.8 10 H10"/>
                <path d="M17 10 V17.8 C17 21 19.2 23 22 23 C24.8 23 27 21 27 17.8 V10"/>
                <path d="M27 10 V23"/>
                <path d="M34 23 V10"/>
                <path d="M34 14 C34 11.6 35.8 10 38.4 10 H41"/>
                <path d="M48 23 V10"/>
                <rect class="f2-pulso" x="46" y="2.5" width="4" height="4" stroke="none"/>
                <path d="M66 16.5 C66 12.9 63.6 10 60.5 10 C57.4 10 55 12.9 55 16.5
                         C55 20.1 57.4 23 60.5 23 C63.6 23 66 20.1 66 16.5 Z"/>
                <path d="M66 10 V23"/>
            </svg>
        </div>

        <!-- O que a máquina está fazendo AGORA. Parada, é cinza. Trabalhando,
             é a única palavra em fósforo da tela. -->
        <div class="f2-estado" id="estado">parada</div>

        <!-- O contador de fita. É a piada do relógio do Poolsuite, só que aqui
             é verdade: é o tempo de material já moído. -->
        <div class="f2-fita">
            <span class="f2-contador" id="contador">00:00:00</span>
            <span class="f2-olho" aria-hidden="true"></span>
        </div>
    </header>

    <!-- ── a parede ──────────────────────────────────────────────────────
         Aqui vão morar os cortes, cinzas, acendendo em cor sob o mouse.
         Enquanto não há nenhum, ela fica vazia de verdade. -->
    <main class="f2-parede" id="parede">
        <div class="f2-vazio" id="vazio">
            <!-- Uma régua de nada. Não é enfeite: é a escala da bancada, e é
                 exatamente onde o mapa da fonte vai nascer na tela 5. -->
            <svg class="f2-regua" width="460" height="30" viewBox="0 0 460 30"
                 fill="none" aria-hidden="true" stroke="currentColor">
                <path d="M0.5 21.5 H459.5" stroke-width="1"/>
                <g stroke-width="1">
                    <path d="M0.5 21.5 V9"/>   <path d="M46 21.5 V15"/>
                    <path d="M92 21.5 V15"/>   <path d="M138 21.5 V15"/>
                    <path d="M184 21.5 V15"/>  <path d="M230 21.5 V9"/>
                    <path d="M276 21.5 V15"/>  <path d="M322 21.5 V15"/>
                    <path d="M368 21.5 V15"/>  <path d="M414 21.5 V15"/>
                    <path d="M459.5 21.5 V9"/>
                </g>
            </svg>
            <div class="f2-vazio-linha">bancada vazia</div>
            <!-- Uma linha só, no tom mais baixo que ainda se lê. A instrução
                 de verdade mora no lugar onde ela é executada: o objeto
                 "fonte", lá embaixo, é o único que respira em verde enquanto
                 não houver material. -->
            <div class="f2-vazio-dica">puxe a fonte da doca</div>
        </div>
    </main>

    <!-- ── a doca ────────────────────────────────────────────────────────
         Prateleira, não menu. Cada objeto tem o nome escrito embaixo por
         extenso — ícone sozinho é adivinhação, e ele não vai adivinhar
         trezentas vezes por dia. Clicar sobe o objeto como janela.
         Nenhum sobe sozinho. -->
    <nav class="f2-doca" aria-label="ferramentas">

        <button class="f2-objeto" data-objeto="fonte" aria-pressed="false">
            <!-- rolo de fita -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
                <circle cx="12" cy="12" r="9"/>
                <circle cx="12" cy="12" r="1.9"/>
                <circle cx="12" cy="6.6" r="1.9"/>
                <circle cx="16.7" cy="14.7" r="1.9"/>
                <circle cx="7.3" cy="14.7" r="1.9"/>
            </svg>
            <span class="f2-nome">fonte</span>
        </button>

        <button class="f2-objeto" data-objeto="talho" aria-pressed="false">
            <!-- lâmina de emenda sobre a tira -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
                <rect x="2.5" y="7.5" width="19" height="9"/>
                <path d="M6 7.5 V16.5 M18 7.5 V16.5"/>
                <path d="M8.5 2.5 L15.5 21.5"/>
            </svg>
            <span class="f2-nome">talho</span>
        </button>

        <button class="f2-objeto" data-objeto="mapa" aria-pressed="false">
            <!-- a faixa da fonte, com um buraco no meio -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
                <path d="M1.5 18.5 H22.5"/>
                <rect x="1.5" y="8" width="6.5" height="6.5"/>
                <rect x="10" y="8" width="3.5" height="6.5"/>
                <rect x="18" y="8" width="4.5" height="6.5"/>
            </svg>
            <span class="f2-nome">mapa</span>
        </button>

        <button class="f2-objeto" data-objeto="painel" aria-pressed="false">
            <!-- o medidor de ponteiro -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
                <path d="M2.5 18 A9.5 9.5 0 0 1 21.5 18"/>
                <path d="M12 18 L16.5 10.5"/>
                <circle cx="12" cy="18" r="1.4"/>
            </svg>
            <span class="f2-nome">painel</span>
        </button>

        <button class="f2-objeto" data-objeto="ajustes" aria-pressed="false">
            <!-- dois cursores de mesa -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
                <path d="M8 3 V21 M16 3 V21"/>
                <rect x="4.5" y="7" width="7" height="3"/>
                <rect x="12.5" y="14" width="7" height="3"/>
            </svg>
            <span class="f2-nome">ajustes</span>
        </button>

        <button class="f2-objeto" data-objeto="registro" aria-pressed="false">
            <!-- a folha do registro -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
                <rect x="4.5" y="2.5" width="15" height="19"/>
                <path d="M8 8 H16 M8 12 H16 M8 16 H13"/>
            </svg>
            <span class="f2-nome">registro</span>
        </button>

    </nav>
</div>

<!-- O canal por onde o motor conta o que está fazendo. Vem do próprio
     programa (nada de rede), e é o mesmo arquivo que a interface antiga usa —
     duas cópias da mesma biblioteca é uma para esquecer de atualizar.
     Rodando a bancada sozinha, sem o motor, ele simplesmente não existe e a
     tela continua de pé. -->
<script src="/static/vendor/socket.io.min.js"></script>
<script src="{{ url_for('bancada.static', filename='js/bancada.js') }}"></script>
</body>
</html>
